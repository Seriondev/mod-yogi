          package com.example.clientutils;

          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          import java.util.List;

          public class WaypointListScreen extends BaseScreen {
              private static final int PER_PAGE = 5;
              private final int page;

              public WaypointListScreen(Screen parent, int page) {
                  super(parent, "Waypoint");
                  this.page = page;
              }

              private static int maxPage() {
                  return Math.max(0, (Config.get().list.size() - 1) / PER_PAGE);
              }

              @Override
              protected void build() {
                  addDrawableChild(ButtonWidget.builder(Text.literal("+ Tambah"),
                          b -> this.client.setScreen(new WaypointEditScreen(this, -1)))
                          .dimensions(px + pw - 100, py + 8, 90, 20).build());

                  List<Config.Waypoint> l = Config.get().list;
                  int start = page * PER_PAGE;
                  for (int i = 0; i < PER_PAGE; i++) {
                      int idx = start + i;
                      if (idx >= l.size()) break;
                      Config.Waypoint w = l.get(idx);
                      int y = py + 38 + i * 26;
                      final int fi = idx;

                      swatches.add(new int[]{px + 14, y + 5, 10, w.color});
                      String dim = w.dim == null ? "?" : w.dim.replace("minecraft:", "");
                      String s = w.name + "  [" + w.x + ", " + w.y + ", " + w.z + "]  " + dim;
                      label(this.textRenderer.trimToWidth(s, pw - 140), px + 32, y + 6);

                      addDrawableChild(ButtonWidget.builder(Text.literal("Edit"),
                              b -> this.client.setScreen(new WaypointEditScreen(this, fi)))
                              .dimensions(px + pw - 98, y, 40, 20).build());
                      addDrawableChild(ButtonWidget.builder(Text.literal("Hapus"), b -> {
                          Config.get().list.remove(fi);
                          Config.save();
                          this.client.setScreen(new WaypointListScreen(parent, Math.min(page, maxPage())));
                      }).dimensions(px + pw - 54, y, 44, 20).build());
                  }

                  int by = py + ph - 26;
                  ButtonWidget prev = ButtonWidget.builder(Text.literal("<"),
                          b -> this.client.setScreen(new WaypointListScreen(parent, page - 1)))
                          .dimensions(px + 14, by, 40, 20).build();
                  prev.active = page > 0;
                  addDrawableChild(prev);

                  ButtonWidget next = ButtonWidget.builder(Text.literal(">"),
                          b -> this.client.setScreen(new WaypointListScreen(parent, page + 1)))
                          .dimensions(px + 60, by, 40, 20).build();
                  next.active = page < maxPage();
                  addDrawableChild(next);

                  label("Hal. " + (page + 1) + "/" + (maxPage() + 1) + "   Total: " + l.size(), px + 110, by + 6);
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/WaypointEditScreen.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;

          public class WaypointEditScreen extends BaseScreen {
              private final int idx;
              private final Config.Waypoint w = new Config.Waypoint();
              private TextFieldWidget nameF, xF, yF, zF;

              public WaypointEditScreen(Screen parent, int idx) {
                  super(parent, idx < 0 ? "Waypoint Baru" : "Edit Waypoint");
                  this.idx = idx;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (idx >= 0 && idx < Config.get().list.size()) {
                      Config.Waypoint o = Config.get().list.get(idx);
                      w.name = o.name;
                      w.dim = o.dim;
                      w.x = o.x;
                      w.y = o.y;
                      w.z = o.z;
                      w.color = o.color;
                  } else if (mc.player != null && mc.world != null) {
                      w.name = "Waypoint " + (Config.get().list.size() + 1);
                      w.dim = mc.world.getRegistryKey().getValue().toString();
                      w.x = mc.player.getBlockX();
                      w.y = mc.player.getBlockY();
                      w.z = mc.player.getBlockZ();
                  }
              }

              private static int num(String s, int def) {
                  try {
                      return Integer.parseInt(s.trim());
                  } catch (Exception e) {
                      return def;
                  }
              }

              @Override
              protected void build() {
                  int x = px + 14;
                  label("Nama", x, py + 34);
                  nameF = new TextFieldWidget(this.textRenderer, x, py + 44, 220, 18, Text.literal("Nama"));
                  nameF.setMaxLength(24);
                  nameF.setText(w.name);
                  addDrawableChild(nameF);

                  label("X", x, py + 68);
                  label("Y", x + 66, py + 68);
                  label("Z", x + 132, py + 68);
                  xF = new TextFieldWidget(this.textRenderer, x, py + 78, 58, 16, Text.literal("X"));
                  yF = new TextFieldWidget(this.textRenderer, x + 66, py + 78, 58, 16, Text.literal("Y"));
                  zF = new TextFieldWidget(this.textRenderer, x + 132, py + 78, 58, 16, Text.literal("Z"));
                  xF.setText(String.valueOf(w.x));
                  yF.setText(String.valueOf(w.y));
                  zF.setText(String.valueOf(w.z));
                  addDrawableChild(xF);
                  addDrawableChild(yF);
                  addDrawableChild(zF);

                  colorRow(py + 102, "Warna", () -> w.color, v -> w.color = v);

                  String dim = w.dim == null ? "?" : w.dim.replace("minecraft:", "");
                  label("Dimensi: " + dim, x, py + 138);

                  addDrawableChild(ButtonWidget.builder(Text.literal("Simpan"), b -> save())
                          .dimensions(x, py + 156, 100, 20).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Batal"), b -> this.client.setScreen(parent))
                          .dimensions(x + 108, py + 156, 100, 20).build());
              }

              private void save() {
                  String n = nameF.getText().trim();
                  if (n.isEmpty()) n = "Waypoint";
                  w.name = n;
                  w.x = num(xF.getText(), w.x);
                  w.y = num(yF.getText(), w.y);
                  w.z = num(zF.getText(), w.z);
                  if (idx < 0 || idx >= Config.get().list.size()) Config.get().list.add(w);
                  else Config.get().list.set(idx, w);
                  Config.save();
                  this.client.setScreen(parent);
              }
          }
          EOF


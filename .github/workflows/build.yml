          package com.example.clientutils;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;

          import java.util.ArrayList;
          import java.util.List;

          public class ModMenuScreen extends BaseScreen {
              private final int tab;
              private TextFieldWidget search;
              private final List<Tile> tiles = new ArrayList<>();
              private int tw, th, rowH, cx0;

              private static class Tile {
                  Features.F f;
                  ButtonWidget toggle, gear;
                  int x, y, w, h;
                  boolean show;
              }

              public ModMenuScreen(int tab) {
                  super(null, "Mod Menu");
                  this.tab = tab;
              }

              @Override
              protected int pillX() {
                  return px + 44;
              }

              @Override
              protected void build() {
                  tiles.clear();
                  addDrawableChild(ButtonWidget.builder(Text.empty(), b -> this.client.setScreen(new ModMenuScreen(0)))
                          .dimensions(px + 6, py + 8, 34, 28).build());
                  addDrawableChild(ButtonWidget.builder(Text.empty(), b -> this.client.setScreen(new ModMenuScreen(1)))
                          .dimensions(px + 6, py + 40, 34, 28).build());

                  if (tab == 0) buildMods();
                  else buildGeneral();
              }

              private void buildMods() {
                  cx0 = px + 44;
                  int gw = pw - 52;
                  tw = (gw - 12) / 3;
                  rowH = Math.max(24, Math.min(34, (ph - 44) / 4));
                  th = rowH - 6;

                  addDrawableChild(ButtonWidget.builder(Text.literal("Clear"), b -> {
                      if (search != null) search.setText("");
                  }).dimensions(px + 180, py + 8, 36, 20).build());

                  search = new TextFieldWidget(this.textRenderer, px + 220, py + 8, pw - 228, 20, Text.literal("Search"));
                  search.setPlaceholder(Text.literal("Search mods..."));
                  addDrawableChild(search);

                  for (Features.F f : Features.all()) {
                      Tile t = new Tile();
                      t.f = f;
                      int w = tw - (f.settings ? 16 : 0);
                      t.toggle = ButtonWidget.builder(Text.empty(), b -> {
                          f.set.accept(!f.get.get());
                          Config.save();
                      }).dimensions(0, 0, w, th).build();
                      addDrawableChild(t.toggle);
                      if (f.settings) {
                          t.gear = ButtonWidget.builder(Text.empty(),
                                  b -> this.client.setScreen(new SettingsScreen(this, f.id, f.name)))
                                  .dimensions(0, 0, 14, th).build();
                          addDrawableChild(t.gear);
                      }
                      tiles.add(t);
                  }
                  search.setChangedListener(s -> relayout());
                  relayout();
              }

              private void relayout() {
                  String q = search == null ? "" : search.getText().toLowerCase();
                  int i = 0;
                  for (Tile t : tiles) {
                      boolean m = q.isEmpty() || t.f.name.toLowerCase().contains(q);
                      t.show = m;
                      t.toggle.visible = m;
                      if (t.gear != null) t.gear.visible = m;
                      if (!m) continue;
                      int col = i % 3, row = i / 3;
                      t.x = cx0 + col * (tw + 6);
                      t.y = py + 36 + row * rowH;
                      t.w = tw;
                      t.h = th;
                      t.toggle.setX(t.x);
                      t.toggle.setY(t.y);
                      if (t.gear != null) {
                          t.gear.setX(t.x + tw - 14);
                          t.gear.setY(t.y);
                      }
                      i++;
                  }
              }

              private void buildGeneral() {
                  int x = px + 50;
                  int y = py + 40;
                  label("Keybind (bisa diubah di Options > Controls):", x, y);
                  label("U  -  Buka Mod Menu", x, y + 14);
                  label("R  -  Elytra Swapper", x, y + 26);
                  label("Y  -  Ender Pearl + Wind Charge", x, y + 38);
                  label("F  -  Spear Lunge (ubah 'Swap Offhand' bila bentrok)", x, y + 50);
                  addDrawableChild(ButtonWidget.builder(Text.literal("Reset semua pengaturan"), b -> {
                      Config.resetFeatures();
                      this.client.setScreen(new ModMenuScreen(1));
                  }).dimensions(x, y + 80, 200, 20).build());
              }

              @Override
              public void render(DrawContext c, int mx, int my, float d) {
                  super.render(c, mx, my, d);

                  // sidebar tab
                  Ui.box(c, px + 6, py + 8, 34, 28, tab == 0 ? 0xFF3A3A5A : 0xFF22222F, tab == 0 ? Ui.PILL : Ui.BORDER);
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Mods"), px + 23, py + 18, 0xFFFFFFFF);
                  Ui.box(c, px + 6, py + 40, 34, 28, tab == 1 ? 0xFF3A3A5A : 0xFF22222F, tab == 1 ? Ui.PILL : Ui.BORDER);
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Info"), px + 23, py + 50, 0xFFFFFFFF);

                  if (tab != 0) return;

                  for (Tile t : tiles) {
                      if (!t.show) continue;
                      boolean on = t.f.get.get();
                      int ww = t.f.settings ? t.w - 16 : t.w;
                      Ui.box(c, t.x, t.y, ww, t.h, on ? Ui.ON_BG : Ui.OFF_BG, on ? Ui.ON_BD : Ui.OFF_BD);
                      if (t.toggle.isHovered()) c.fill(t.x + 1, t.y + 1, t.x + ww - 1, t.y + t.h - 1, 0x22FFFFFF);
                      String name = this.textRenderer.trimToWidth(t.f.name, ww - 10);
                      c.drawTextWithShadow(this.textRenderer, Text.literal(name), t.x + 6, t.y + (t.h - 8) / 2, 0xFFFFFFFF);
                      if (t.gear != null) {
                          Ui.box(c, t.x + t.w - 14, t.y, 14, t.h, 0xFF2A2A3C, Ui.BORDER);
                          if (t.gear.isHovered()) c.fill(t.x + t.w - 13, t.y + 1, t.x + t.w - 1, t.y + t.h - 1, 0x22FFFFFF);
                          c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(">"),
                                  t.x + t.w - 7, t.y + (t.h - 8) / 2, 0xFFFFFFFF);
                      }
                  }
              }
          }
